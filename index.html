<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory</title>
  </head>
  <body>
    <section class="screen home screen--active">
      <div class="home__content">
        <p class="home__subtitle">It's play time</p>
        <h1 class="home__title">Ready to play?</h1>
      </div>

      <button class="btn-play">
        <img
          class="btn-play__icon"
          src="/images/basic/stadia_controller.png"
          alt=""
        />Play
        <img class="btn-play__arrow" src="/images/basic/arrow.png" alt="" />
      </button>

      <img
        class="home__bg-icon"
        src="/images/basic/stadia_controller_yellow.png"
        alt=""
      />
    </section>

    <section class="screen settings">
      <h2 class="settings__title">Settings</h2>
      <div class="settings__divider"></div>
      <div class="settings__content">
        <div class="settings__left">
          <fieldset>
            <legend>
              <img src="./public/images/basic/palette.svg" alt="game img" />Game
              themes
            </legend>
            <label>
              <input type="radio" name="theme" value="Code theme" /> Code vibes
              theme
              <span class="label__indicator"></span>
            </label>
            <label>
              <input type="radio" name="theme" value="Game theme" /> Gaming theme
              <span class="label__indicator"></span>
            </label>
            <label>
              <input type="radio" name="theme" value="DA theme" /> DA Projects
              theme
              <span class="label__indicator"></span>
            </label>
            <label>
              <input type="radio" name="theme" value="Food theme" /> Food theme
              <span class="label__indicator"></span>
            </label>
          </fieldset>

          <fieldset>
            <legend>
              <img
                src="./public/images/basic/chess_pawn.svg"
                alt="player img"
              />Choose player
            </legend>
            <label>
              <input type="radio" name="player" value="Player blue" /> Blue
              <span class="label__indicator"></span>
            </label>
            <label>
              <input type="radio" name="player" value="Player orange" /> Orange
              <span class="label__indicator"></span>
            </label>
          </fieldset>

          <fieldset>
            <legend>
              <img src="./public/images/basic/style.svg" alt="Board img" />Board
              Size
            </legend>
            <label>
              <input type="radio" name="board-size" value="16 cards" /> 16 cards
              <span class="label__indicator"></span>
            </label>
            <label>
              <input type="radio" name="board-size" value="24 cards" /> 24 cards
              <span class="label__indicator"></span>
            </label>
            <label>
              <input type="radio" name="board-size" value="36 cards" /> 36 cards
              <span class="label__indicator"></span>
            </label>
          </fieldset>
        </div>

        <div class="settings__right">
          <img
            class="settings__bar-img"
            src="./public/images/vibes_theme/vibe_theme.png"
            alt="game img"
          />
          <div class="settings__preview">
            <div class="settings__bar">
              <span id="selected-theme">Game theme</span>
              <span class="settings__bar-divider">/</span>
              <span id="selected-player">Player</span>
              <span class="settings__bar-divider">/</span>
              <span id="selected-size">Board size</span>
              <button class="settings__bar-btn" disabled>
                <img
                  class="settings__bar-btn-icon"
                  src="public/images/basic/smart_display.svg"
                  alt="start img"
                />Start
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
